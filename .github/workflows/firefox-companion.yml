name: Aster Firefox companion

on:
  pull_request:
    paths:
      - 'experiments/firefox/**'
      - '.github/workflows/firefox-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test navigation, blocking, backups and local highlights
        run: node --test experiments/firefox/tests/core.test.cjs
      - name: Validate add-on package
        run: npx --yes --package=web-ext@10.6.0 web-ext lint --source-dir experiments/firefox/extension --warnings-as-errors
      - name: Install test driver
        run: python -m pip install selenium==4.35.0
      - name: Install official Firefox on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US' --output "$RUNNER_TEMP/firefox.tar.xz"
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
          echo "FIREFOX_BINARY=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
      - name: Locate official Firefox on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $browserPath = Join-Path $env:ProgramFiles 'Mozilla Firefox\firefox.exe'
          if (-not (Test-Path $browserPath)) {
            $installerPath = Join-Path $env:RUNNER_TEMP 'FirefoxSetup.exe'
            Invoke-WebRequest 'https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US' -OutFile $installerPath
            Start-Process -FilePath $installerPath -ArgumentList '/S' -Wait
          }
          if (-not (Test-Path $browserPath)) { throw 'Firefox installation was not found' }
          "FIREFOX_BINARY=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Exercise real Firefox with temporary add-on
        run: python experiments/firefox/tests/smoke_firefox.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: aster-firefox-${{ runner.os }}-unsigned-test-build
          path: |
            experiments/firefox/dist/*
            experiments/firefox/artifacts/*.png
          if-no-files-found: error
          retention-days: 14
