name: Aster install and update scripts

on:
  pull_request:
    paths:
      - 'installers/**'
      - 'install-linux.sh'
      - 'docs/setup/**'
      - 'experiments/webkit/aster_webkit/documents.py'
      - 'experiments/webkit/aster_webkit/assistant.py'
      - 'experiments/webkit/tests/test_*.py'
      - '.github/workflows/setup-installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test install, update, failures and rollback
        run: python -m unittest discover -s installers/tests -p 'test_*.py' -v
      - name: Validate Python syntax
        run: python -m compileall -q installers
      - name: Test the browser the installers actually ship
        # The kit carries its own tests but nothing ran them, so two had been
        # failing unnoticed - one of them because the settings page had stopped
        # offering the default theme, which quietly moved anyone who saved
        # settings onto another one with no way back. Extract the kit and run
        # them here, where a red test is visible before a release is cut.
        run: |
          python -c "import zipfile; zipfile.ZipFile('Aster-Browser-Windows-Kit-v16.zip').extractall('kit-check')"
      - name: Run the kit's own tests
        working-directory: kit-check/aster-browser-windows-kit
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test portable reading and assistant logic
        run: python -m unittest discover -s experiments/webkit/tests -p 'test_*.py' -v
      - name: Validate Linux bootstrap
        if: runner.os == 'Linux'
        run: |
          bash -n install-linux.sh
          bash install-linux.sh --help
          bash install-linux.sh --extract-only "$RUNNER_TEMP/aster-check"
          test -f "$RUNNER_TEMP/aster-check/run_aster.py"
          test -f "$RUNNER_TEMP/aster-check/aster_browser/translations.py"
          test -d "$RUNNER_TEMP/aster-check/aster_browser/locales"
      - name: Check Windows availability without installing another browser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./installers/install-windows.ps1 -Check
          if ($LASTEXITCODE -ne 0) { throw 'Setup check failed' }
      - name: Verify real downloads from this repository branch
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ASTER_GITHUB_TOKEN: ${{ github.token }}
        run: python installers/tests/live_download.py
