name: Aster original engine preview

on:
  pull_request:
    paths:
      - 'experiments/aster-engine/**'
      - '.github/workflows/aster-engine-preview.yml'
  workflow_dispatch:
    inputs:
      android_api:
        description: 'Emulator API: 26 supports lightweight software testing; 35 needs suitable virtualization'
        type: choice
        options: ['26', '35']
        default: '26'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Test original parser, layout, HTTP and Java2D; build native package
        run: python experiments/aster-engine/build.py desktop --test --package
      - name: Open the Linux native application
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a experiments/aster-engine/build/native/AsterEnginePreview/bin/AsterEnginePreview --smoke experiments/aster-engine/build/aster-window.png
      - name: Decode and display actual Linux video frames
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libgtk-3-0t64 libavcodec60 libavformat60 libavutil58 libasound2t64
          xvfb-run -a experiments/aster-engine/build/native/AsterEnginePreview/bin/AsterEnginePreview --media-smoke experiments/aster-engine/build/aster-media-frame.png
      - name: Stream real HLS and control it from a page on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pulseaudio libasound2-plugins
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=aster_ci
          pactl set-default-sink aster_ci
          cat > experiments/aster-engine/build/alsa-ci.conf <<'EOF'
          pcm.!default { type pulse }
          ctl.!default { type pulse }
          EOF
          ALSA_CONFIG_PATH="$PWD/experiments/aster-engine/build/alsa-ci.conf" xvfb-run -a experiments/aster-engine/build/native/AsterEnginePreview/bin/AsterEnginePreview --stream-smoke experiments/aster-engine/build/aster-stream-frame.png
      - name: Open the Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asterOutput = Join-Path $PWD 'experiments/aster-engine/build/aster-window.png'
          $asterProcess = Start-Process -FilePath './experiments/aster-engine/build/native/AsterEnginePreview/AsterEnginePreview.exe' -ArgumentList @('--smoke', $asterOutput) -PassThru
          if (-not $asterProcess.WaitForExit(30000)) { $asterProcess.Kill(); throw 'Aster window did not finish its smoke check' }
          if ($asterProcess.ExitCode -ne 0 -or -not (Test-Path $asterOutput)) { throw 'Aster EXE smoke check failed' }
      - name: Decode and display actual Windows video frames
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asterFrame = Join-Path $PWD 'experiments/aster-engine/build/aster-media-frame.png'
          $asterVideo = Start-Process -FilePath './experiments/aster-engine/build/native/AsterEnginePreview/AsterEnginePreview.exe' -ArgumentList @('--media-smoke', $asterFrame) -PassThru
          if (-not $asterVideo.WaitForExit(40000)) { $asterVideo.Kill(); throw 'Aster video did not finish its playback check' }
          if ($asterVideo.ExitCode -ne 0 -or -not (Test-Path $asterFrame)) {
            if (Test-Path "$asterFrame.log") { Get-Content -LiteralPath "$asterFrame.log" }
            throw 'Aster EXE did not decode the test video'
          }
      - name: Stream real HLS and control it from a page on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table Name, Status, StartType
          Set-Service AudioEndpointBuilder -StartupType Manual
          Set-Service Audiosrv -StartupType Manual
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          Get-CimInstance Win32_SoundDevice | Select-Object Name, Status
          $asterFrame = Join-Path $PWD 'experiments/aster-engine/build/aster-stream-frame.png'
          $asterDecoder = "$asterFrame.decoder.log"
          $asterStream = Start-Process -FilePath './experiments/aster-engine/build/native/AsterEnginePreview/AsterEnginePreview.exe' -ArgumentList @('--stream-smoke', $asterFrame) -RedirectStandardError $asterDecoder -PassThru
          if (-not $asterStream.WaitForExit(90000)) { $asterStream.Kill(); throw 'Aster streaming check timed out' }
          if ($asterStream.ExitCode -ne 0 -or -not (Test-Path $asterFrame)) {
            if (Test-Path "$asterFrame.log") { Get-Content -LiteralPath "$asterFrame.log" }
            if (Test-Path $asterDecoder) { Get-Content -LiteralPath $asterDecoder -Tail 100 }
            throw 'Aster EXE streaming and page media controls failed'
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: aster-engine-${{ runner.os }}
          path: |
            experiments/aster-engine/build/*.zip
            experiments/aster-engine/build/*.tar.gz
            experiments/aster-engine/build/*.png
            experiments/aster-engine/build/SHA256SUMS.txt
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTER_EMULATOR_API: ${{ inputs.android_api || '26' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify the actual Android APK
        run: python experiments/aster-engine/build.py android
      - name: Boot Android
        run: python experiments/aster-engine/tests/start_android_emulator.py
      - name: Exercise navigation and a data-preserving APK replacement
        env:
          ANDROID_SERIAL: emulator-5554
        run: python experiments/aster-engine/tests/android_smoke.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: aster-engine-Android
          path: |
            experiments/aster-engine/build/android/aster-engine-preview.apk
            experiments/aster-engine/build/android/*.png
            experiments/aster-engine/build/android/*.log
            experiments/aster-engine/build/android/drm-device-report.xml
            experiments/aster-engine/build/SHA256SUMS.txt
          retention-days: 14
